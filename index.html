<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti, Xime 💛</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a002c, #3d0043, #1f002b);
      font-family: 'Poppins', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Canvas para partículas de fondo */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 3.2rem;
      color: #ffe867;
      text-shadow: 0 0 15px rgba(255, 232, 103, 0.6), 0 0 30px rgba(255, 215, 0, 0.4);
      margin-bottom: 25px;
      animation: pulseText 3s infinite alternate;
    }

    /* Contenedor del Ramo */
    .bouquet-container {
      position: relative;
      width: 320px;
      height: 420px;
      margin: 0 auto 25px;
      cursor: pointer;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
      transition: transform 0.3s ease;
    }

    /* Animación de balanceo suave */
    .swaying {
      animation: sway 4s ease-in-out infinite alternate;
      transform-origin: bottom center;
    }

    @keyframes sway {
      0% { transform: rotate(-3deg); }
      100% { transform: rotate(3deg); }
    }

    @keyframes pulseText {
      0% { text-shadow: 0 0 10px rgba(255, 232, 103, 0.5); }
      100% { text-shadow: 0 0 25px rgba(255, 215, 0, 0.9), 0 0 40px rgba(255, 235, 59, 0.6); }
    }

    /* Botón */
    .btn-group {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    .btn {
      background: linear-gradient(45deg, #ffd700, #ff9800);
      color: #3d0043;
      border: none;
      padding: 14px 32px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
      background: linear-gradient(45deg, #ffee58, #ffa726);
    }

    /* Tarjeta modal con la carta */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .card {
      background: linear-gradient(145deg, #ffffff, #fffde7);
      color: #333;
      padding: 35px 25px;
      border-radius: 20px;
      max-width: 450px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      transform: translateY(30px) scale(0.9);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .card {
      transform: translateY(0) scale(1);
    }

    .card h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: #d81b60;
      margin-bottom: 15px;
    }

    .card p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #444;
      margin-bottom: 25px;
    }

    .card .close-btn {
      background: #d81b60;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .card .close-btn:hover {
      background: #ad1457;
    }

    /* Efecto de destellos */
    .floating-emoji {
      position: absolute;
      pointer-events: none;
      font-size: 24px;
      animation: floatUp 1.8s forwards ease-out;
      z-index: 5;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.6) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% - 120px)) scale(1.4) rotate(var(--rot));
      }
    }
  </style>
</head>
<body>

  <canvas id="particle-canvas"></canvas>

  <div class="container">
    <h1>Para ti, Xime 💛</h1>

    <!-- Ramo SVG de Lirios Amarillos -->
    <div class="bouquet-container swaying" id="bouquet" onclick="burstEffects(event)">
      <svg viewBox="0 0 300 400" width="100%" height="100%">
        <defs>
          <linearGradient id="lilyPetalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFF8D" />
            <stop offset="50%" stop-color="#FFEB3B" />
            <stop offset="100%" stop-color="#FBC02D" />
          </linearGradient>

          <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4CAF50" />
            <stop offset="100%" stop-color="#1B5E20" />
          </linearGradient>

          <linearGradient id="wrapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#f5f5f5" />
          </linearGradient>
          
          <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ff4081" />
            <stop offset="100%" stop-color="#c2185b" />
          </linearGradient>

          <!-- Modelo de Lirio Amarillo -->
          <g id="lilyFlower">
            <!-- Pétalos estilizados -->
            <g fill="url(#lilyPetalGrad)" stroke="#F57F17" stroke-width="0.8">
              <path d="M 0 0 Q -18 -40 0 -70 Q 18 -40 0 0" />
              <path d="M 0 0 Q -18 -40 0 -70 Q 18 -40 0 0" transform="rotate(60)" />
              <path d="M 0 0 Q -18 -40 0 -70 Q 18 -40 0 0" transform="rotate(120)" />
              <path d="M 0 0 Q -18 -40 0 -70 Q 18 -40 0 0" transform="rotate(180)" />
              <path d="M 0 0 Q -18 -40 0 -70 Q 18 -40 0 0" transform="rotate(240)" />
              <path d="M 0 0 Q -18 -40 0 -70 Q 18 -40 0 0" transform="rotate(300)" />
            </g>
            <!-- Centro y Estambres -->
            <circle cx="0" cy="0" r="8" fill="#C0CA33" />
            <g stroke="#8D6E63" stroke-width="2" stroke-linecap="round">
              <line x1="0" y1="0" x2="-8" y2="-22" />
              <line x1="0" y1="0" x2="8" y2="-22" />
              <line x1="0" y1="0" x2="-20" y2="-8" />
              <line x1="0" y1="0" x2="20" y2="-8" />
              <line x1="0" y1="0" x2="-12" y2="18" />
              <line x1="0" y1="0" x2="12" y2="18" />
            </g>
            <g fill="#E65100">
              <ellipse cx="-8" cy="-24" rx="4" ry="2" transform="rotate(-20 -8 -24)" />
              <ellipse cx="8" cy="-24" rx="4" ry="2" transform="rotate(20 8 -24)" />
              <ellipse cx="-22" cy="-8" rx="4" ry="2" transform="rotate(-60 -22 -8)" />
              <ellipse cx="22" cy="-8" rx="4" ry="2" transform="rotate(60 22 -8)" />
              <ellipse cx="-13" cy="20" rx="4" ry="2" transform="rotate(40 -13 20)" />
              <ellipse cx="13" cy="20" rx="4" ry="2" transform="rotate(-40 13 20)" />
            </g>
          </g>
        </defs>

        <!-- Tallos -->
        <g stroke="url(#stemGrad)" stroke-width="6" stroke-linecap="round">
          <path d="M 150 220 Q 130 290 120 370" />
          <path d="M 150 220 Q 150 290 150 370" />
          <path d="M 150 220 Q 170 290 180 370" />
          <path d="M 95 160 Q 130 240 145 330" />
          <path d="M 205 160 Q 170 240 155 330" />
        </g>

        <!-- Hojas -->
        <g fill="#2E7D32">
          <path d="M 125 280 Q 70 260 80 310 Q 115 300 130 290 Z" />
          <path d="M 175 280 Q 230 260 220 310 Q 185 300 170 290 Z" />
          <path d="M 110 230 Q 55 200 65 240 Q 95 240 118 235 Z" />
          <path d="M 190 230 Q 245 200 235 240 Q 205 240 182 235 Z" />
        </g>

        <!-- Envoltorio del ramo -->
        <path d="M 95 250 L 205 250 L 175 360 L 125 360 Z" fill="url(#wrapGrad)" opacity="0.95" />
        <!-- Lazo rosa -->
        <path d="M 115 280 Q 150 290 185 280 L 180 295 Q 150 303 120 295 Z" fill="url(#ribbonGrad)" />
        <circle cx="150" cy="288" r="8" fill="#c2185b" />
        <path d="M 150 288 Q 135 315 125 340 M 150 288 Q 165 315 175 340" stroke="#c2185b" stroke-width="4" fill="none" />

        <!-- Flores de Lirio en el Ramo -->
        <use href="#lilyFlower" x="150" y="90" transform="scale(0.9) translate(16, 10)" />
        <use href="#lilyFlower" x="95" y="145" transform="scale(0.85) translate(15, 15)" />
        <use href="#lilyFlower" x="205" y="145" transform="scale(0.85) translate(-15, 15)" />
        <use href="#lilyFlower" x="150" y="170" transform="scale(1)" />
      </svg>
    </div>

    <div class="btn-group">
      <button class="btn" onclick="openModal()">💌 Leer Carta Especial</button>
    </div>
  </div>

  <!-- Modal con Mensaje Personalizado -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="card">
      <h2>Muaa</h2>
      <p>
        Quise tener este presente contigo. Sé que fallo con el contacto cero y sé que no está bien, discúlpame. 
        <br><br>
        Un pequeño ramo yellow para ti, ¡abrazitos!
      </p>
      <button class="close-btn" onclick="closeModal()">Cerrar 🤗</button>
    </div>
  </div>

  <script>
    /* --- Partículas de Fondo --- */
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 20;
        this.size = Math.random() * 5 + 2;
        this.speedY = Math.random() * 1.5 + 0.5;
        this.speedX = Math.random() * 1 - 0.5;
        this.opacity = Math.random() * 0.7 + 0.3;
        this.color = Math.random() > 0.3 ? '#ffd700' : '#fff59d';
        this.rotation = Math.random() * 360;
        this.rotSpeed = Math.random() * 2 - 1;
      }

      update() {
        this.y -= this.speedY;
        this.x += Math.sin(this.y * 0.01) + this.speedX;
        this.rotation += this.rotSpeed;

        if (this.y < -20) {
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;

        ctx.beginPath();
        ctx.ellipse(0, 0, this.size, this.size * 1.8, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i < 45; i++) {
        const p = new Particle();
        p.y = Math.random() * canvas.height;
        particles.push(p);
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }

    initParticles();
    animateParticles();

    /* --- Efecto al tocar el ramo --- */
    function burstEffects(event) {
      const emojis = ['💛', '✨', '🌸', '⭐'];

      for (let i = 0; i < 10; i++) {
        const el = document.createElement('span');
        el.className = 'floating-emoji';
        el.innerText = emojis[Math.floor(Math.random() * emojis.length)];

        const x = event.clientX;
        const y = event.clientY;

        el.style.left = `${x}px`;
        el.style.top = `${y}px`;

        const dx = (Math.random() - 0.5) * 160;
        const rot = (Math.random() - 0.5) * 90;
        el.style.setProperty('--dx', `${dx}px`);
        el.style.setProperty('--rot', `${rot}deg`);

        document.body.appendChild(el);

        setTimeout(() => {
          el.remove();
        }, 1800);
      }
    }

    /* --- Control del Modal --- */
    function openModal() {
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }
  </script>
</body>
</html>
