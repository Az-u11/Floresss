<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti, Xime 💛</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #120023, #2e0036, #1a0024);
      font-family: 'Poppins', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Canvas para partículas de fondo */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 3.2rem;
      color: #ffe867;
      text-shadow: 0 0 15px rgba(255, 232, 103, 0.7), 0 0 30px rgba(255, 215, 0, 0.5);
      margin-bottom: 15px;
      animation: pulseText 3s infinite alternate;
    }

    /* Contenedor del Ramo */
    .bouquet-container {
      position: relative;
      width: 340px;
      height: 450px;
      margin: 0 auto 20px;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
    }

    /* Resplandor dorado detrás del ramo */
    .bouquet-glow {
      position: absolute;
      top: 15%;
      left: 15%;
      width: 70%;
      height: 60%;
      background: radial-gradient(circle, rgba(255, 235, 59, 0.35) 0%, rgba(255, 193, 7, 0.15) 50%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      z-index: -1;
      animation: glowPulse 2.5s infinite alternate ease-in-out;
    }

    /* Animación de balanceo suave */
    .swaying {
      animation: sway 4s ease-in-out infinite alternate;
      transform-origin: bottom center;
    }

    @keyframes sway {
      0% { transform: rotate(-3.5deg); }
      100% { transform: rotate(3.5deg); }
    }

    @keyframes glowPulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    @keyframes pulseText {
      0% { text-shadow: 0 0 10px rgba(255, 232, 103, 0.5); }
      100% { text-shadow: 0 0 25px rgba(255, 215, 0, 0.9), 0 0 40px rgba(255, 235, 59, 0.6); }
    }

    /* Botón */
    .btn-group {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    .btn {
      background: linear-gradient(45deg, #ffd700, #ff9800);
      color: #3d0043;
      border: none;
      padding: 14px 34px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(255, 215, 0, 0.5);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 6px 22px rgba(255, 215, 0, 0.7);
      background: linear-gradient(45deg, #ffee58, #ffa726);
    }

    /* Tarjeta modal con la carta */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .card {
      background: linear-gradient(145deg, #ffffff, #fffde7);
      color: #333;
      padding: 35px 25px;
      border-radius: 20px;
      max-width: 450px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      transform: translateY(30px) scale(0.9);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .card {
      transform: translateY(0) scale(1);
    }

    .card h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: #d81b60;
      margin-bottom: 15px;
    }

    .card p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #444;
      margin-bottom: 25px;
    }

    .card .close-btn {
      background: #d81b60;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .card .close-btn:hover {
      background: #ad1457;
    }

    /* Efecto de destellos flotantes */
    .floating-emoji {
      position: fixed;
      pointer-events: none;
      font-size: 24px;
      animation: floatUp 2.2s forwards ease-out;
      z-index: 5;
    }

    @keyframes floatUp {
      0% {
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(0.5) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% - 140px)) scale(1.5) rotate(var(--rot));
      }
    }
  </style>
</head>
<body>

  <canvas id="particle-canvas"></canvas>

  <div class="container">
    <h1>Para ti, Xime 💛</h1>

    <!-- Ramo SVG de Lirios Amarillos Detallado -->
    <div class="bouquet-container swaying" id="bouquet">
      <div class="bouquet-glow"></div>
      <svg viewBox="0 0 340 450" width="100%" height="100%">
        <defs>
          <!-- Gradiente Pétalo Exterior -->
          <linearGradient id="petalOuterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFDE7" />
            <stop offset="35%" stop-color="#FFF176" />
            <stop offset="80%" stop-color="#FBC02D" />
            <stop offset="100%" stop-color="#F57F17" />
          </linearGradient>

          <!-- Gradiente Pétalo Interior -->
          <linearGradient id="petalInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="40%" stop-color="#FFEE58" />
            <stop offset="85%" stop-color="#FDD835" />
            <stop offset="100%" stop-color="#F57C00" />
          </linearGradient>

          <!-- Gradiente Tallos -->
          <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4CAF50" />
            <stop offset="50%" stop-color="#2E7D32" />
            <stop offset="100%" stop-color="#1B5E20" />
          </linearGradient>

          <!-- Gradiente Envoltorio Doble -->
          <linearGradient id="wrapOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#e0e0e0" />
          </linearGradient>

          <linearGradient id="wrapInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fff9c4" />
            <stop offset="100%" stop-color="#ffe082" />
          </linearGradient>
          
          <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ff4081" />
            <stop offset="100%" stop-color="#ad1457" />
          </linearGradient>

          <!-- MODELO DETALLADO DE LIRIO AMARILLO -->
          <g id="richLily">
            <!-- Capa Posterior de Pétalos (3) -->
            <g fill="url(#petalOuterGrad)" stroke="#F57F17" stroke-width="0.8">
              <path d="M 0 0 Q -22 -45 0 -80 Q 22 -45 0 0" />
              <path d="M 0 0 Q -22 -45 0 -80 Q 22 -45 0 0" transform="rotate(120)" />
              <path d="M 0 0 Q -22 -45 0 -80 Q 22 -45 0 0" transform="rotate(240)" />
            </g>
            <!-- Capa Frontal de Pétalos (3) -->
            <g fill="url(#petalInnerGrad)" stroke="#FF8F00" stroke-width="0.9">
              <path d="M 0 0 Q -20 -40 0 -75 Q 20 -40 0 0" transform="rotate(60)" />
              <path d="M 0 0 Q -20 -40 0 -75 Q 20 -40 0 0" transform="rotate(180)" />
              <path d="M 0 0 Q -20 -40 0 -75 Q 20 -40 0 0" transform="rotate(300)" />
            </g>
            <!-- Puntos de textura en el centro -->
            <g fill="#D84315" opacity="0.85">
              <circle cx="0" cy="-22" r="1.5" /><circle cx="-4" cy="-18" r="1.2" /><circle cx="4" cy="-18" r="1.2" />
              <circle cx="18" cy="10" r="1.5" /><circle cx="-18" cy="10" r="1.5" />
            </g>
            <!-- Centro Verde -->
            <circle cx="0" cy="0" r="9" fill="#9E9D24" stroke="#827717" stroke-width="1" />
            <!-- Estambres largos -->
            <g stroke="#6D4C41" stroke-width="2.2" stroke-linecap="round">
              <line x1="0" y1="0" x2="-10" y2="-28" />
              <line x1="0" y1="0" x2="10" y2="-28" />
              <line x1="0" y1="0" x2="-25" y2="-10" />
              <line x1="0" y1="0" x2="25" y2="-10" />
              <line x1="0" y1="0" x2="-15" y2="22" />
              <line x1="0" y1="0" x2="15" y2="22" />
            </g>
            <!-- Anteras Naranjas de los Estambres -->
            <g fill="#BF360C">
              <ellipse cx="-10" cy="-30" rx="5" ry="2.5" transform="rotate(-20 -10 -30)" />
              <ellipse cx="10" cy="-30" rx="5" ry="2.5" transform="rotate(20 10 -30)" />
              <ellipse cx="-27" cy="-10" rx="5" ry="2.5" transform="rotate(-65 -27 -10)" />
              <ellipse cx="27" cy="-10" rx="5" ry="2.5" transform="rotate(65 27 -10)" />
              <ellipse cx="-16" cy="24" rx="5" ry="2.5" transform="rotate(35 -16 24)" />
              <ellipse cx="16" cy="24" rx="5" ry="2.5" transform="rotate(-35 16 24)" />
            </g>
          </g>

          <!-- Flor Secundaria Pequeña / Botón -->
          <g id="lilyBud">
            <path d="M 0 0 Q -12 -25 0 -45 Q 12 -25 0 0" fill="url(#petalOuterGrad)" stroke="#F57F17" />
            <path d="M -5 0 Q -15 -20 -3 -38 Q 5 -20 -5 0" fill="url(#petalInnerGrad)" stroke="#FF8F00" />
            <path d="M 0 5 Q -8 15 -12 30 M 0 5 Q 8 15 12 30" stroke="#388E3C" stroke-width="3" fill="none" />
          </g>
        </defs>

        <!-- Tallos Múltiples -->
        <g stroke="url(#stemGrad)" stroke-width="6.5" stroke-linecap="round">
          <path d="M 170 230 Q 140 310 130 400" />
          <path d="M 170 230 Q 170 310 170 400" />
          <path d="M 170 230 Q 200 310 210 400" />
          <path d="M 100 170 Q 145 260 160 370" />
          <path d="M 240 170 Q 195 260 180 370" />
          <path d="M 170 120 L 170 230" />
        </g>

        <!-- Hojas Verdes Alargadas y Frondosas -->
        <g fill="#2E7D32" stroke="#1B5E20" stroke-width="1">
          <path d="M 140 300 Q 70 280 85 330 Q 125 320 145 310 Z" />
          <path d="M 200 300 Q 270 280 255 330 Q 215 320 195 310 Z" />
          <path d="M 120 240 Q 50 210 60 255 Q 100 255 128 248 Z" />
          <path d="M 220 240 Q 290 210 280 255 Q 240 255 212 248 Z" />
          <path d="M 150 200 Q 90 150 105 190 Q 130 200 145 205 Z" />
          <path d="M 190 200 Q 250 150 235 190 Q 210 200 195 205 Z" />
        </g>

        <!-- Ramitos Decorativos (Bolitas Amarillas / Mimoza) -->
        <g fill="#FFD54F" stroke="#F57F17" stroke-width="0.5">
          <circle cx="80" cy="130" r="5" /><circle cx="72" cy="120" r="4" /><circle cx="90" cy="122" r="4.5" />
          <circle cx="260" cy="130" r="5" /><circle cx="268" cy="120" r="4" /><circle cx="250" cy="122" r="4.5" />
          <circle cx="170" cy="50" r="5" /><circle cx="160" cy="42" r="4" /><circle cx="180" cy="44" r="4" />
        </g>

        <!-- Capa Trasera de Envoltorio -->
        <path d="M 75 220 L 265 220 L 220 390 L 120 390 Z" fill="url(#wrapInnerGrad)" opacity="0.9" />
        <path d="M 60 190 L 280 190 L 210 390 L 130 390 Z" fill="url(#wrapOuterGrad)" opacity="0.95" />

        <!-- Lazo Rosa Elegante -->
        <path d="M 125 300 Q 170 315 215 300 L 208 320 Q 170 332 132 320 Z" fill="url(#ribbonGrad)" />
        <circle cx="170" cy="310" r="10" fill="#ad1457" />
        <path d="M 170 310 Q 150 345 135 375 M 170 310 Q 190 345 205 375" stroke="#ad1457" stroke-width="5" stroke-linecap="round" fill="none" />

        <!-- FLORES DEL RAMO (Abundantes) -->
        <!-- Flor Superior Izquierda -->
        <use href="#richLily" x="110" y="110" transform="scale(0.85) translate(20, 15)" />
        
        <!-- Flor Superior Derecha -->
        <use href="#richLily" x="230" y="110" transform="scale(0.85) translate(-20, 15)" />
        
        <!-- Flor Superior Central -->
        <use href="#richLily" x="170" y="80" transform="scale(0.88)" />

        <!-- Flor Lat. Izquierda -->
        <use href="#richLily" x="80" y="170" transform="scale(0.8) translate(25, -10)" />

        <!-- Flor Lat. Derecha -->
        <use href="#richLily" x="260" y="170" transform="scale(0.8) translate(-25, -10)" />

        <!-- FLOR CENTRAL PRINCIPAL (Grande) -->
        <use href="#richLily" x="170" y="175" transform="scale(1.08)" />

        <!-- Capullos de Lirio en los bordes -->
        <use href="#lilyBud" x="60" y="110" transform="rotate(-25 60 110)" />
        <use href="#lilyBud" x="280" y="110" transform="rotate(25 280 110) scale(1, 1)" />
      </svg>
    </div>

    <div class="btn-group">
      <button class="btn" onclick="openModal()">💌 Leer Carta Especial</button>
    </div>
  </div>

  <!-- Modal con Mensaje Personalizado -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="card">
      <h2>Muaa</h2>
      <p>
        Quise tener este presente contigo. Sé que fallo con el contacto cero y sé que no está bien, discúlpame. 
        <br><br>
        Un pequeño ramo yellow para ti, ¡abrazitos!
      </p>
      <button class="close-btn" onclick="closeModal()">Cerrar 🤗</button>
    </div>
  </div>

  <script>
    /* --- Partículas de Fondo Flotantes --- */
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 20;
        this.size = Math.random() * 5 + 2;
        this.speedY = Math.random() * 1.5 + 0.5;
        this.speedX = Math.random() * 1 - 0.5;
        this.opacity = Math.random() * 0.7 + 0.3;
        this.color = Math.random() > 0.3 ? '#ffd700' : '#fff59d';
        this.rotation = Math.random() * 360;
        this.rotSpeed = Math.random() * 2 - 1;
      }

      update() {
        this.y -= this.speedY;
        this.x += Math.sin(this.y * 0.01) + this.speedX;
        this.rotation += this.rotSpeed;

        if (this.y < -20) {
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;

        ctx.beginPath();
        ctx.ellipse(0, 0, this.size, this.size * 1.8, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i < 50; i++) {
        const p = new Particle();
        p.y = Math.random() * canvas.height;
        particles.push(p);
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }

    initParticles();
    animateParticles();

    /* --- Generador de Destellos y Emojis Flotantes --- */
    function spawnSparks(x, y, count = 6) {
      const emojis = ['💛', '✨', '🌸', '⭐', '💛', '✨'];

      for (let i = 0; i < count; i++) {
        const el = document.createElement('span');
        el.className = 'floating-emoji';
        el.innerText = emojis[Math.floor(Math.random() * emojis.length)];

        el.style.left = `${x}px`;
        el.style.top = `${y}px`;

        const dx = (Math.random() - 0.5) * 180;
        const rot = (Math.random() - 0.5) * 100;
        el.style.setProperty('--dx', `${dx}px`);
        el.style.setProperty('--rot', `${rot}deg`);

        document.body.appendChild(el);

        setTimeout(() => {
          el.remove();
        }, 2200);
      }
    }

    /* --- Animación AUTOMÁTICA cada 2 segundos --- */
    function autoBurstAnimation() {
      const bouquet = document.getElementById('bouquet');
      if (!bouquet) return;

      const rect = bouquet.getBoundingClientRect();
      // Puntos aleatorios alrededor de la flor de los lirios
      const randomX = rect.left + (rect.width * 0.2) + Math.random() * (rect.width * 0.6);
      const randomY = rect.top + (rect.height * 0.15) + Math.random() * (rect.height * 0.45);

      spawnSparks(randomX, randomY, 5);
    }

    // Inicia ráfaga automática cada 2000 ms (2 segundos)
    setInterval(autoBurstAnimation, 2000);

    /* --- Control del Modal --- */
    function openModal() {
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }
  </script>
</body>
</html>
