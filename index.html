<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti, Xime 💛</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #120023, #2e0036, #1a0024);
      font-family: 'Poppins', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Canvas para partículas de fondo */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 15px;
      max-width: 650px;
      width: 100%;
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 3.4rem;
      color: #ffe867;
      text-shadow: 0 0 15px rgba(255, 232, 103, 0.8), 0 0 35px rgba(255, 215, 0, 0.6);
      margin-bottom: 10px;
      animation: pulseText 3s infinite alternate;
    }

    /* Contenedor del Ramo Buchón */
    .bouquet-container {
      position: relative;
      width: 380px;
      height: 480px;
      margin: 0 auto 15px;
      filter: drop-shadow(0 18px 30px rgba(0,0,0,0.7));
    }

    /* Resplandor dorado gigante */
    .bouquet-glow {
      position: absolute;
      top: 10%;
      left: 10%;
      width: 80%;
      height: 70%;
      background: radial-gradient(circle, rgba(255, 235, 59, 0.4) 0%, rgba(255, 193, 7, 0.2) 50%, rgba(0,0,0,0) 75%);
      border-radius: 50%;
      z-index: -1;
      animation: glowPulse 2.5s infinite alternate ease-in-out;
    }

    /* Balanceo suave */
    .swaying {
      animation: sway 4s ease-in-out infinite alternate;
      transform-origin: bottom center;
    }

    @keyframes sway {
      0% { transform: rotate(-3deg); }
      100% { transform: rotate(3deg); }
    }

    @keyframes glowPulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    @keyframes pulseText {
      0% { text-shadow: 0 0 10px rgba(255, 232, 103, 0.5); }
      100% { text-shadow: 0 0 25px rgba(255, 215, 0, 0.9), 0 0 40px rgba(255, 235, 59, 0.6); }
    }

    /* Botón solo emoji */
    .btn-group {
      display: flex;
      justify-content: center;
      margin-top: 5px;
    }

    .btn {
      background: linear-gradient(45deg, #ffd700, #ff9800);
      color: #3d0043;
      border: none;
      padding: 12px 30px;
      font-size: 2.2rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .btn:hover {
      transform: translateY(-4px) scale(1.1);
      box-shadow: 0 8px 25px rgba(255, 215, 0, 0.8);
      background: linear-gradient(45deg, #ffee58, #ffa726);
    }

    /* Tarjeta modal con la carta */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .card {
      background: linear-gradient(145deg, #ffffff, #fffde7);
      color: #333;
      padding: 35px 25px;
      border-radius: 20px;
      max-width: 450px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      transform: translateY(30px) scale(0.9);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .card {
      transform: translateY(0) scale(1);
    }

    .card h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: #d81b60;
      margin-bottom: 15px;
    }

    .card p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #444;
      margin-bottom: 25px;
    }

    .card .close-btn {
      background: #d81b60;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .card .close-btn:hover {
      background: #ad1457;
    }

    /* Destellos */
    .floating-emoji {
      position: fixed;
      pointer-events: none;
      font-size: 26px;
      animation: floatUp 2.2s forwards ease-out;
      z-index: 5;
    }

    @keyframes floatUp {
      0% {
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(0.5) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% - 150px)) scale(1.5) rotate(var(--rot));
      }
    }
  </style>
</head>
<body>

  <canvas id="particle-canvas"></canvas>

  <div class="container">
    <h1>Para ti, Xime 💛</h1>

    <!-- Ramo Buchón SVG Gigante -->
    <div class="bouquet-container swaying" id="bouquet">
      <div class="bouquet-glow"></div>
      <svg viewBox="0 0 380 500" width="100%" height="100%">
        <defs>
          <!-- Gradientes Lirio -->
          <linearGradient id="lilyOuterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFDE7" />
            <stop offset="40%" stop-color="#FFF176" />
            <stop offset="80%" stop-color="#FBC02D" />
            <stop offset="100%" stop-color="#F57F17" />
          </linearGradient>
          <linearGradient id="lilyInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="40%" stop-color="#FFEE58" />
            <stop offset="85%" stop-color="#FDD835" />
            <stop offset="100%" stop-color="#F57C00" />
          </linearGradient>

          <!-- Gradiente Rosa Amarilla -->
          <radialGradient id="roseGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFFDE7" />
            <stop offset="40%" stop-color="#FFEB3B" />
            <stop offset="80%" stop-color="#FBC02D" />
            <stop offset="100%" stop-color="#E65100" />
          </radialGradient>

          <!-- Gradientes Envoltorio Ramo Buchón -->
          <linearGradient id="wrapPaperOuter" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#212121" />
            <stop offset="50%" stop-color="#424242" />
            <stop offset="100%" stop-color="#111111" />
          </linearGradient>
          <linearGradient id="wrapPaperGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFE082" />
            <stop offset="50%" stop-color="#FFB300" />
            <stop offset="100%" stop-color="#FF8F00" />
          </linearGradient>

          <!-- MODELO 1: LIRIO AMARILLO DETALLADO -->
          <g id="richLily">
            <g fill="url(#lilyOuterGrad)" stroke="#F57F17" stroke-width="0.8">
              <path d="M 0 0 Q -22 -45 0 -80 Q 22 -45 0 0" />
              <path d="M 0 0 Q -22 -45 0 -80 Q 22 -45 0 0" transform="rotate(120)" />
              <path d="M 0 0 Q -22 -45 0 -80 Q 22 -45 0 0" transform="rotate(240)" />
            </g>
            <g fill="url(#lilyInnerGrad)" stroke="#FF8F00" stroke-width="0.9">
              <path d="M 0 0 Q -20 -40 0 -75 Q 20 -40 0 0" transform="rotate(60)" />
              <path d="M 0 0 Q -20 -40 0 -75 Q 20 -40 0 0" transform="rotate(180)" />
              <path d="M 0 0 Q -20 -40 0 -75 Q 20 -40 0 0" transform="rotate(300)" />
            </g>
            <circle cx="0" cy="0" r="8" fill="#9E9D24" />
            <g stroke="#6D4C41" stroke-width="2" stroke-linecap="round">
              <line x1="0" y1="0" x2="-10" y2="-26" />
              <line x1="0" y1="0" x2="10" y2="-26" />
              <line x1="0" y1="0" x2="-24" y2="-8" />
              <line x1="0" y1="0" x2="24" y2="-8" />
              <line x1="0" y1="0" x2="-14" y2="20" />
              <line x1="0" y1="0" x2="14" y2="20" />
            </g>
            <g fill="#BF360C">
              <ellipse cx="-10" cy="-28" rx="4" ry="2" transform="rotate(-20 -10 -28)" />
              <ellipse cx="10" cy="-28" rx="4" ry="2" transform="rotate(20 10 -28)" />
              <ellipse cx="-26" cy="-8" rx="4" ry="2" transform="rotate(-65 -26 -8)" />
              <ellipse cx="26" cy="-8" rx="4" ry="2" transform="rotate(65 26 -8)" />
              <ellipse cx="-15" cy="22" rx="4" ry="2" transform="rotate(35 -15 22)" />
              <ellipse cx="15" cy="22" rx="4" ry="2" transform="rotate(-35 15 22)" />
            </g>
          </g>

          <!-- MODELO 2: ROSA AMARILLA -->
          <g id="yellowRose">
            <g fill="url(#roseGrad)" stroke="#F57F17" stroke-width="0.5">
              <path d="M 0 -35 C -25 -35 -35 -10 -25 15 C -10 35 10 35 25 15 C 35 -10 25 -35 0 -35 Z" />
              <path d="M -20 -20 Q 0 -40 20 -20 Q 30 10 0 25 Q -30 10 -20 -20" fill="#FFEE58" />
              <path d="M -15 -10 Q 0 -28 15 -10 Q 20 5 0 18 Q -20 5 -15 -10" fill="#FDD835" />
              <circle cx="0" cy="-2" r="10" fill="#F57F17" />
              <path d="M -6 -4 Q 0 -12 6 -4 Q 8 2 0 6 Q -8 2 -6 -4" fill="#FFE082" />
            </g>
          </g>

          <!-- MODELO 3: MARGARITA / MINI GIRASOL -->
          <g id="yellowDaisy">
            <g fill="#FFEE58" stroke="#F57F17" stroke-width="0.5">
              <ellipse cx="0" cy="-22" rx="5" ry="13" />
              <ellipse cx="0" cy="22" rx="5" ry="13" />
              <ellipse cx="-22" cy="0" rx="13" ry="5" />
              <ellipse cx="22" cy="0" rx="13" ry="5" />
              <ellipse cx="-15" cy="-15" rx="5" ry="13" transform="rotate(45 -15 -15)" />
              <ellipse cx="15" cy="15" rx="5" ry="13" transform="rotate(45 15 15)" />
              <ellipse cx="-15" cy="15" rx="5" ry="13" transform="rotate(-45 -15 15)" />
              <ellipse cx="15" cy="-15" rx="5" ry="13" transform="rotate(-45 15 -15)" />
            </g>
            <circle cx="0" cy="0" r="10" fill="#E65100" stroke="#BF360C" stroke-width="1"/>
          </g>

          <!-- MODELO 4: RAMITO DE NUBE / GYPSOPHILA -->
          <g id="gypsophila">
            <path d="M0 0 L-12 -20 M0 0 L12 -20 M0 0 L0 -28 M-12 -20 L-22 -32 M12 -20 L22 -32" stroke="#81C784" stroke-width="1.8" />
            <circle cx="-22" cy="-32" r="3.5" fill="#FFFFFF" />
            <circle cx="-12" cy="-36" r="3" fill="#FFF9C4" />
            <circle cx="0" cy="-30" r="3.5" fill="#FFFFFF" />
            <circle cx="12" cy="-36" r="3" fill="#FFF9C4" />
            <circle cx="22" cy="-32" r="3.5" fill="#FFFFFF" />
          </g>
        </defs>

        <!-- CAPA 1: PAPEL NEGRO/DORADO DE FONDO (ESTILO BUCHÓN) -->
        <g opacity="0.95">
          <!-- Pliegues traseros del papel -->
          <path d="M 30 180 L 190 60 L 350 180 L 260 440 L 120 440 Z" fill="url(#wrapPaperOuter)" />
          <path d="M 45 170 L 190 75 L 335 170 L 250 430 L 130 430 Z" fill="url(#wrapPaperGold)" opacity="0.8" />
          <path d="M 15 210 L 190 110 L 365 210 L 240 440 L 140 440 Z" fill="url(#wrapPaperOuter)" />
        </g>

        <!-- CAPA 2: HOJAS VERDES FRONDOSAS -->
        <g fill="#2E7D32" stroke="#1B5E20" stroke-width="1">
          <path d="M 100 280 Q 20 230 40 300 Q 90 310 110 290 Z" />
          <path d="M 280 280 Q 360 230 340 300 Q 290 310 270 290 Z" />
          <path d="M 120 200 Q 30 150 50 210 Q 100 220 130 205 Z" />
          <path d="M 260 200 Q 350 150 330 210 Q 280 220 250 205 Z" />
          <path d="M 190 140 Q 110 80 130 130 Q 170 140 185 142 Z" />
          <path d="M 190 140 Q 270 80 250 130 Q 210 140 195 142 Z" />
        </g>

        <!-- CAPA 3: RAMOS DE NUBE (LLENADO) -->
        <use href="#gypsophila" x="70" y="150" transform="scale(1.2)" />
        <use href="#gypsophila" x="300" y="150" transform="scale(1.2)" />
        <use href="#gypsophila" x="180" y="70" transform="scale(1.3)" />
        <use href="#gypsophila" x="110" y="90" transform="scale(1.1)" />
        <use href="#gypsophila" x="260" y="90" transform="scale(1.1)" />
        <use href="#gypsophila" x="50" y="220" transform="scale(1.1)" />
        <use href="#gypsophila" x="320" y="220" transform="scale(1.1)" />

        <!-- CAPA 4: FLORES TRASERAS (ROSAS Y MARGARITAS) -->
        <use href="#yellowRose" x="110" y="130" transform="scale(0.85)" />
        <use href="#yellowRose" x="270" y="130" transform="scale(0.85)" />
        <use href="#yellowDaisy" x="190" y="100" transform="scale(0.9)" />
        <use href="#yellowDaisy" x="130" y="180" transform="scale(0.85)" />
        <use href="#yellowDaisy" x="250" y="180" transform="scale(0.85)" />

        <!-- CAPA 5: LIRIOS PRINCIPALES (NIVEL MEDIO) -->
        <use href="#richLily" x="120" y="140" transform="scale(0.9)" />
        <use href="#richLily" x="260" y="140" transform="scale(0.9)" />
        <use href="#richLily" x="190" y="130" transform="scale(0.95)" />
        <use href="#richLily" x="75" y="200" transform="scale(0.85)" />
        <use href="#richLily" x="305" y="200" transform="scale(0.85)" />

        <!-- CAPA 6: ROSAS FRONTAL MEDIO -->
        <use href="#yellowRose" x="150" y="200" transform="scale(0.95)" />
        <use href="#yellowRose" x="230" y="200" transform="scale(0.95)" />
        <use href="#yellowRose" x="190" y="235" transform="scale(0.9)" />

        <!-- CAPA 7: FLORES FRONTALES DESTACADAS (GRANDES) -->
        <use href="#richLily" x="125" y="220" transform="scale(1.05)" />
        <use href="#richLily" x="255" y="220" transform="scale(1.05)" />
        <use href="#richLily" x="190" y="180" transform="scale(1.15)" />

        <!-- CAPA 8: ENVOLTORIO FRONTAL Y LAZO GIGANTE -->
        <path d="M 70 260 L 310 260 L 250 450 L 130 450 Z" fill="url(#wrapPaperOuter)" opacity="0.95" />
        <path d="M 85 260 L 295 260 L 242 440 L 138 440 Z" fill="url(#wrapPaperGold)" opacity="0.4" />

        <!-- Lazo Dorado / Rojo Gigante -->
        <path d="M 120 340 Q 190 360 260 340 L 250 365 Q 190 380 130 365 Z" fill="#D81B60" />
        <circle cx="190" cy="352" r="14" fill="#AD1457" stroke="#FFD700" stroke-width="2" />
        <path d="M 190 352 Q 160 400 135 450 M 190 352 Q 220 400 245 450" stroke="#D81B60" stroke-width="8" stroke-linecap="round" fill="none" />
      </svg>
    </div>

    <div class="btn-group">
      <button class="btn" onclick="openModal()" title="Leer Carta">💌</button>
    </div>
  </div>

  <!-- Modal con Mensaje Personalizado -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="card">
      <h2>Muaa</h2>
      <p>
        Quise tener este presente contigo. Sé que fallo con el contacto cero y sé que no está bien, discúlpame. 
        <br><br>
        Un pequeño ramo yellow para ti, ¡abrazitos!
      </p>
      <button class="close-btn" onclick="closeModal()">Cerrar 🤗</button>
    </div>
  </div>

  <script>
    /* --- Partículas de Fondo --- */
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 20;
        this.size = Math.random() * 5 + 2;
        this.speedY = Math.random() * 1.5 + 0.5;
        this.speedX = Math.random() * 1 - 0.5;
        this.opacity = Math.random() * 0.7 + 0.3;
        this.color = Math.random() > 0.3 ? '#ffd700' : '#fff59d';
        this.rotation = Math.random() * 360;
        this.rotSpeed = Math.random() * 2 - 1;
      }

      update() {
        this.y -= this.speedY;
        this.x += Math.sin(this.y * 0.01) + this.speedX;
        this.rotation += this.rotSpeed;

        if (this.y < -20) {
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;

        ctx.beginPath();
        ctx.ellipse(0, 0, this.size, this.size * 1.8, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i < 55; i++) {
        const p = new Particle();
        p.y = Math.random() * canvas.height;
        particles.push(p);
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }

    initParticles();
    animateParticles();

    /* --- Generador de Destellos Automáticos --- */
    function spawnSparks(x, y, count = 7) {
      const emojis = ['💛', '✨', '🌸', '⭐', '🌻', '✨'];

      for (let i = 0; i < count; i++) {
        const el = document.createElement('span');
        el.className = 'floating-emoji';
        el.innerText = emojis[Math.floor(Math.random() * emojis.length)];

        el.style.left = `${x}px`;
        el.style.top = `${y}px`;

        const dx = (Math.random() - 0.5) * 200;
        const rot = (Math.random() - 0.5) * 120;
        el.style.setProperty('--dx', `${dx}px`);
        el.style.setProperty('--rot', `${rot}deg`);

        document.body.appendChild(el);

        setTimeout(() => {
          el.remove();
        }, 2200);
      }
    }

    /* --- Animación Automática cada 2 segundos --- */
    function autoBurstAnimation() {
      const bouquet = document.getElementById('bouquet');
      if (!bouquet) return;

      const rect = bouquet.getBoundingClientRect();
      const randomX = rect.left + (rect.width * 0.15) + Math.random() * (rect.width * 0.7);
      const randomY = rect.top + (rect.height * 0.1) + Math.random() * (rect.height * 0.5);

      spawnSparks(randomX, randomY, 6);
    }

    setInterval(autoBurstAnimation, 2000);

    /* --- Control del Modal --- */
    function openModal() {
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }
  </script>
</body>
</html>
